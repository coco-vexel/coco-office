name: Documentation issue
description: Report unclear, missing, or incorrect public documentation
title: 'docs: '
labels: ['documentation', 'needs-triage']
body:
  - type: input
    id: location
    attributes:
      label: Documentation location
      description: Link or repository path to the affected page.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is unclear or incorrect?
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested improvement
  - type: checkboxes
    id: checks
    attributes:
      label: Submission checks
      options:
        - label: I searched existing issues and pull requests.
          required: true
